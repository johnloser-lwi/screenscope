<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScreenScope</title>
  <link rel="stylesheet" href="./ui/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Toolbar (macOS only — hidden on Windows via body class) -->
    <div id="toolbar">
      <select id="source-select"></select>
      <button id="btn-refresh" title="Refresh source list">↺</button>
      <button id="btn-select-region">Select Region</button>
      <span id="region-info"></span>

      <label class="toolbar-field">
        Layout
        <select id="layout-select"></select>
      </label>
      <label class="toolbar-field">
        Smoothing
        <select id="smoothing-select">
          <option value="off">Off</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <label id="always-on-top-label">
        <input type="checkbox" id="chk-always-on-top" />
        Always on top
      </label>
      <span id="fps-display">— fps</span>
    </div>

    <!-- Scopes area — cells are created at runtime from the layout preset -->
    <div id="scope-area"></div>

    <div id="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v4l3 3"/>
      </svg>
      <span id="empty-hint">Select a source and region to begin</span>
    </div>

    <!-- Status bar (Windows only — hidden on macOS via body class) -->
    <div id="status-bar">
      <span id="status-region-info"></span>
      <span id="status-fps-display">— fps</span>
    </div>

  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
