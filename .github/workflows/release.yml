name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: release/*.dmg
          - os: windows-latest
            artifact: release/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # macOS: build .app first, ad-hoc sign it, then package into DMG.
      # Without re-signing, the Electron binary's linker signature causes
      # "code has no resources but signature indicates they must be present"
      # and macOS Gatekeeper marks the app as broken.
      - name: Build app bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: npx vite build && npx electron-builder --mac dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ad-hoc sign app bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -name "*.app" -maxdepth 2 | head -1)
          echo "Signing: $APP"
          codesign --force --deep --sign - "$APP"

      - name: Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -name "*.app" -maxdepth 2 | head -1)
          npx electron-builder --mac dmg --publish never --prepackaged "$APP"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: ScreenScope v${{ steps.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
